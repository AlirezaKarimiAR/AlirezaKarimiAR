<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Alireza Karimi  Backend Developer">
  <defs>
    <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E10600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="200" rx="14" fill="url(#carbon)"/>
  <rect width="900" height="200" rx="14" fill="url(#redGlow)"/>
  <rect x="0" y="0" width="900" height="4" fill="#E10600"/>
  <rect x="0" y="196" width="900" height="4" fill="#FFF200"/>

  <!-- start lights -->
  <g transform="translate(290 28)">
    <circle cx="0" cy="0" r="11" fill="#E10600"/>
    <circle cx="40" cy="0" r="11" fill="#E10600"/>
    <circle cx="80" cy="0" r="11" fill="#E10600"/>
    <circle cx="120" cy="0" r="11" fill="#E10600"/>
    <circle cx="160" cy="0" r="11" fill="#E10600"/>
    <circle cx="200" cy="0" r="11" fill="#2ECC40" opacity="0.95">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="450" y="58" text-anchor="middle" fill="#FFF200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4">LIGHTS OUT AND AWAY WE GO</text>

  <text x="450" y="110" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800">Alireza Karimi</text>
  <text x="450" y="142" text-anchor="middle" fill="#EDEDED" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Backend Developer  ·  Race Engineer for APIs</text>
  <text x="450" y="172" text-anchor="middle" fill="#E10600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">.NET  |  Go  |  Python  |  SQL Server  |  PostgreSQL  |  MySQL</text>
</svg>
